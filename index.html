<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Links</title>
<meta name="theme-color" content="#f4f1ee">
<style>
  :root {
    --bg: #f4f1ee;
    --card: #ffffff;
    --text: #1d1b19;
    --muted: #7a736c;
    --border: rgba(0,0,0,.06);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
    --accent: #1d1b19;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1f1d1b;
      --text: #f2efec;
      --muted: #9a938c;
      --border: rgba(255,255,255,.07);
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --accent: #f2efec;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 56px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 104px; height: 104px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--card);
    box-shadow: var(--shadow);
    display: grid; place-items: center;
    font-size: 38px; font-weight: 600; color: var(--muted);
    border: 3px solid var(--card);
  }
  h1 { margin-top: 18px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  .bio { margin-top: 6px; font-size: 14.5px; color: var(--muted); text-align: center; line-height: 1.5; max-width: 320px; white-space: pre-line; }
  .links { width: 100%; margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .link {
    position: relative;
    display: flex; align-items: center;
    min-height: 60px;
    padding: 8px 52px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    color: var(--text);
    text-decoration: none;
    font-size: 15px; font-weight: 600;
    justify-content: center; text-align: center;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .link:active { transform: scale(.98); }
  @media (hover: hover) { .link:hover { transform: translateY(-2px); } }
  .icon {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .icon svg { width: 22px; height: 22px; fill: #fff; }
  .save {
    margin-top: 22px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 999px;
    padding: 13px 26px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .save svg { width: 18px; height: 18px; fill: currentColor; }
  footer { margin-top: 36px; font-size: 12px; color: var(--muted); opacity: .7; }
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ============================================================
   只需要改这里 👇  —— 改完保存即可，卡片不用重写

const CONFIG = {

  // 「保存联系人」按钮：对方一点就能把你存进通讯录。不需要就把 showSaveContact 改成 false

  contact: {
    phone: "+60165210347",
    email: "",
    company: "",
    title: "Sales & Marketing",

  // 按钮列表：type 决定图标和颜色。可选：
  // instagram / tiktok / facebook / whatsapp / xiaohongshu / spotify / youtube / discord /
  // paypal / tng / telegram / linkedin / x / email / phone / website

    { type: "whatsapp",    label: "WhatsApp",  url: "https://wa.me/60165210347" },

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function render() {
  const c = CONFIG;
  document.title = c.name;
  const initials = c.name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const avatar = c.avatar
    ? `<img class="avatar" src="${esc(c.avatar)}" alt="">`
    : `<div class="avatar">${esc(initials)}</div>`;

  const links = c.links.map(l => {
    const [color, path] = ICONS[l.type] || ICONS.website;
    return `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">
      <span class="icon" style="background:${color}"><svg viewBox="0 0 24 24">${path}</svg></span>
      ${esc(l.label)}
    </a>`;
  }).join("");

  const save = c.showSaveContact
    ? `<button class="save" onclick="saveContact()"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.7 0-8 1.34-8 4v2h10.5a6 6 0 0 1 3.4-5.3A13 13 0 0 0 12 14zm7 1v2h2v2h-2v2h-2v-2h-2v-2h2v-2h2z"/></svg>Save Contact</button>`
    : "";

  document.getElementById("app").innerHTML = `
    ${avatar}
    <h1>${esc(c.name)}</h1>
    ${c.bio ? `<p class="bio">${esc(c.bio)}</p>` : ""}
    <div class="links">${links}</div>
    ${save}
    <footer>Tap · Connect</footer>`;
}

function saveContact() {
  const c = CONFIG, k = c.contact;
  const lines = [
    "BEGIN:VCARD", "VERSION:3.0",
    `FN:${c.name}`, `N:${c.name};;;;`,
    k.phone && `TEL;TYPE=CELL:${k.phone}`,
    k.email && `EMAIL:${k.email}`,
    k.company && `ORG:${k.company}`,
    k.title && `TITLE:${k.title}`,
    `URL:${location.href}`,
    c.bio && `NOTE:${c.bio}`,
    "END:VCARD",
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([lines], { type: "text/vcard" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${c.name.replace(/\s+/g, "_")}.vcf`;
  a.click();
}

render();
</script>

</html>
